const $=id=>document.getElementById(id),st=n=>S[n]||"Not Started",open_={};
function stats(){let tot=0,sol=0,must=0,ms=0,ip=0,rv=0;T.forEach(t=>t.q.forEach(([n,,,p])=>{tot++;const s=st(n);if(s=="Solved")sol++;if(s=="In Progress")ip++;if(s=="Revisit")rv++;if(p=="M"){must++;if(s=="Solved")ms++}}));

$("st").innerHTML=`<span><b>${sol}</b> / ${tot} solved (${Math.round(sol/tot*100)}%)</span><span>Must-do: <b>${ms}</b> / ${must}</span><span>In progress: <b>${ip}</b></span><span>Revisit: <b>${rv}</b></span>`}
function renderT(){const q=$("q").value.trim().toLowerCase(),fd=$("fd").value,fp=$("fp").value,fs=$("fs").value,filt=!!(q||fd||fp||fs);let h="";

if(!rows.length)return;
const op=filt||open_[ti]?" open":"";
h+=`<details class="card" data-i="${ti}"${op}><summary><span class="tn">${t.t}<small>${t.w}</small></span><span class="cnt">${sol}/${all.length}</span><div class="bar"><i style="width:${sol/all.length*100}%"></i></div></summary><div class="tc">${t.c}</div><div class="sc">`+
rows.map(([n,ti2,d,p,i])=>{const s=st(n);return `<div class="r s-${s}"><select data-n="${n}">${ST.map(o=>`<option${o==s?" selected":""}>${o}</option>`).join("")}</select><span class="n">#${n}</span><a href="https://leetcode.com/problems/${slug(ti2)}/" target="_blank" rel="noopener noreferrer">${ti2}</a><span class="d-${DF[d]}">${DF[d]}</span><span class="p-${PR[p]}">${PR[p]}</span><span class="id">${i}</span></div>`}).join("")+`</div></details>`});
